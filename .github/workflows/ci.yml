name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  package:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build macOS app and dmg
        if: runner.os == 'macOS'
        run: packaging/macos/build.sh
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: packaging\windows\build.ps1
      - name: Smoke test the built app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN="dist/Sleeve.app/Contents/MacOS/Sleeve"
            FF="dist/Sleeve.app/Contents/Frameworks/ffmpeg/ffmpeg"
          else
            BIN="dist/Sleeve/Sleeve.exe"
            FF="dist/Sleeve/_internal/ffmpeg/ffmpeg.exe"
          fi
          "$FF" -hide_banner -encoders | grep -E "libmp3lame|aac"
          export SLEEVE_HOME="$RUNNER_TEMP/sleeve-home"
          ("$BIN" &) ; sleep 8
          grep "ffmpeg: .*ffmpeg" "$SLEEVE_HOME/logs/sleeve.log"
      - uses: actions/upload-artifact@v4
        with:
          name: sleeve-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error
